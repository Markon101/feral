[package]
name = "feral"
version = "0.1.0"
edition = "2021"
description = "FERAL — Freeform Evolutionary Resonant Audio Laboratory"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustfft = "6.4"
opencl3 = { version = "0.12.3", optional = true, default-features = false, features = ["dynamic", "CL_VERSION_1_2"] }

[features]
default = []
opencl = ["dep:opencl3"]

[profile.release]
opt-level = 3

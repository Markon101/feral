[package]
name = "feral"
version = "0.1.0"
edition = "2021"
description = "FERAL — Freeform Evolutionary Resonant Audio Laboratory"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
